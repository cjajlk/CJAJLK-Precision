<!doctype html><meta charset="utf-8"><title>Contrôles navigateur V2</title>
<style>body{margin:0;background:#16231c;color:white;font:14px Arial}iframe{border:0;display:block}pre{white-space:pre-wrap}button{padding:12px}</style>
<button id="run">Tester tactile portrait, paysage et 40 tirs</button><button id="layout">Vérifier uniquement les deux dispositions</button><pre id="log">Prêt</pre><iframe id="game" width="390" height="844" src="../index.html"></iframe>
<script type="module">
const frame=document.querySelector('#game'),log=document.querySelector('#log');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test)=>{const end=Date.now()+10000;while(!test()){if(Date.now()>end)throw Error('Transition trop longue');await wait(100);}};
const check=(condition,label)=>{log.textContent+='\n'+(condition?'PASS ':'FAIL ')+label;if(!condition)throw Error(label);};
const click=id=>frame.contentDocument.getElementById(id).click();
const get=id=>frame.contentDocument.getElementById(id);
const pointer=(el,type,id,x,y)=>el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,pointerType:'touch',pointerId:id,clientX:x,clientY:y,button:0,buttons:type==='pointerup'?0:1}));
const tap=id=>{pointer(get(id),'pointerdown',52,20,20);pointer(get(id),'pointerup',52,20,20);};
document.querySelector('#run').onclick=async()=>{
 log.textContent='En cours — événements tactiles synthétiques dans le navigateur WebGL';
 try{
 get('series').value='40';get('sound').checked=false;get('oscillations').checked=false;click('start');click('zoom');await wait(1000);
 check(get('sportSight').classList.contains('hidden')===false,'visée au dioptre');
 // Synthetic pointers cannot acquire native capture; movement is still tested with the same application handlers.
 const canvas=get('scene');const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
 pointer(canvas,'pointerdown',51,120,420);pointer(canvas,'pointermove',51,220,420);await wait(150);tap('fire');await wait(850);pointer(canvas,'pointerup',51,220,420);canvas.setPointerCapture=capture;
 check(get('sessionProgress').textContent.includes('1/40'),'glisser puis tirer au doigt');
 check(Number(get('score').textContent)<10,'glissement déplace effectivement le point d’impact');
 click('recenter');await wait(200);
 for(let i=1;i<40;i++){
  if(i%5===0)click('nextTarget');
  const before=get('sessionProgress').textContent;tap('fire');await wait(100);check(get('sessionProgress').textContent===before&&get('ammo').textContent==='0','tir à vide bloqué '+i);
  check(get('status').textContent==='Rechargement nécessaire','rechargement manuel requis '+i);
  click('reload');tap('fire');await until(()=>get('status').textContent==='1 plomb chargé');
  check(get('sessionProgress').textContent===before,'tir bloqué pendant rechargement '+i);
  tap('fire');await wait(800);
 }
 check(get('sessionProgress').textContent.includes('40/40'),'40 départs et 8 cartons');
 check(get('nextTarget').disabled,'fin de séance bloque le carton suivant');
 const score=Number(get('score').textContent);tap('fire');await wait(100);check(Number(get('score').textContent)===score,'aucun 41e tir');
 const stored=JSON.parse(frame.contentWindow.localStorage.getItem('cjajlk-precision-sessions'));check(stored.at(-1).shots.length===40,'40 coordonnées sauvegardées');
 click('retrieve');await wait(2000);check(get('retrieve').textContent.includes('RENVOYER'),'arrivée au pas de tir');check(get('targetReport').textContent.includes('Dispersion'),'statistiques physiques visibles');
 click('retrieve');await until(()=>get('retrieve').textContent.includes('REPRENDRE')&&!get('retrieve').disabled);click('retrieve');await wait(250);check(get('retrieve').textContent.includes('RAMENER'),'restauration du contrôle après renvoi');
 click('pause');check(!get('menu').classList.contains('hidden'),'pause');click('resume');
 await layouts();
 log.textContent+='\nTERMINÉ : tous les contrôles réussis. Aucun téléphone physique testé.';
 }catch(e){log.textContent+='\nÉCHEC : '+e.message;}
};
async function layouts(){
 for(const [w,h] of [[390,844],[844,390]]){
 frame.width=w;frame.height=h;await wait(300);
 const ids=['recenter','zoom','fire','reload','retrieve'];
 const boxes=ids.map(id=>{const r=get(id).getBoundingClientRect();check(r.width>=44&&r.height>=44,id+' cible tactile ≥44 px en '+w+'×'+h);return {id,r};});
 for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];check(!(a.r.left<b.r.right&&a.r.right>b.r.left&&a.r.top<b.r.bottom&&a.r.bottom>b.r.top),a.id+'/'+b.id+' sans superposition');}
 }

}
document.querySelector('#layout').onclick=async()=>{log.textContent='Contrôles des dispositions';try{get('series').value='40';click('start');click('zoom');await wait(600);await layouts();log.textContent+='\nTERMINÉ : dispositions validées.';}catch(e){log.textContent+='\nÉCHEC : '+e.message;}};
</script>
