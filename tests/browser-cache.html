<!doctype html><meta charset="utf-8"><title>Vérification cache 0.6.3</title><button id="run">Vérifier les ressources hors ligne</button><pre id="log">Prêt</pre><script type="module">document.querySelector('#run').onclick=async()=>{const log=document.querySelector('#log');try{await navigator.serviceWorker.register('../sw.js');await navigator.serviceWorker.ready;let cache;for(let i=0;i<100;i++){if((await caches.keys()).includes('cjajlk-precision-0.6.3')){cache=await caches.open('cjajlk-precision-0.6.3');if(await cache.match('../carnet/feedback.js'))break;}await new Promise(r=>setTimeout(r,100));}for(const name of ['index.html','app.js','model.js','targets.js','feelings.js','feedback.js','style.css']){const hit=await cache.match('../carnet/'+name);if(!hit||!hit.ok)throw Error('Manquant : '+name);if(name==='index.html'&&!(await hit.text()).includes('V0.6.3'))throw Error('Ancienne version HTML');log.textContent+='\nPASS '+name;}log.textContent+='\nTERMINÉ : cache V0.6.3 complet.';}catch(e){log.textContent+='\nÉCHEC '+e.message;}};</script>
