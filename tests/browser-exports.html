<!doctype html><meta charset="utf-8"><title>Exports carnet</title><button id="run">Tester photo, import et exports</button><pre id="log">Prêt</pre><iframe id="app" src="../carnet/index.html" width="390" height="844"></iframe><script type="module">
const f=document.querySelector('#app'),log=document.querySelector('#log'),key='cjajlk-real-notebook-v1',wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(v,m)=>{log.textContent+='\n'+(v?'PASS ':'FAIL ')+m;if(!v)throw Error(m);};const el=id=>f.contentDocument.getElementById(id),click=id=>el(id).click();const until=async(fn)=>{for(let i=0;i<100;i++){if(fn())return;await wait(100);}throw Error('Délai dépassé');};
document.querySelector('#run').onclick=async()=>{const old=localStorage.getItem(key);try{log.textContent='En cours';click('new');let captured=[];const originalURL=f.contentWindow.URL.createObjectURL.bind(f.contentWindow.URL);f.contentWindow.URL.createObjectURL=b=>{captured.push(b);return originalURL(b);};f.contentWindow.HTMLAnchorElement.prototype.click=function(){};f.contentWindow.confirm=()=>true;
const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1000;const x=canvas.getContext('2d');x.fillStyle='white';x.fillRect(0,0,1600,1000);x.fillStyle='black';x.beginPath();x.arc(800,500,200,0,7);x.fill();const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'carton-test.png',{type:'image/png'}));el('photo').files=dt.files;el('photo').dispatchEvent(new Event('change'));await until(()=>!el('photoPreview').hidden);check(el('photoPreview').naturalWidth<=1200,'photo réduite ≤1200 pixels');click('sheet');click('image');await until(()=>captured.length===1);check(captured[0].type==='image/png','carte PNG générée');check(new Uint8Array(await captured[0].arrayBuffer())[0]===137,'signature PNG valide');
f.contentDocument.querySelector('[data-page="backup"]').click();click('exportBackup');await until(()=>captured.length===2);const text=await captured[1].text(),parsed=JSON.parse(text);check(parsed.app==='cjajlk-real-notebook'&&parsed.sessions.at(-1).photo.startsWith('data:image/jpeg'),'JSON contient séance et photo');const dt2=new DataTransfer();dt2.items.add(new File([text],'backup.json',{type:'application/json'}));el('importBackup').files=dt2.files;el('importBackup').dispatchEvent(new Event('change'));await until(()=>el('notice').textContent.includes('doublon'));check(el('notice').textContent.startsWith('0 séance'),'réimport sans doublon');const saved=localStorage.getItem(key);const dt3=new DataTransfer();dt3.items.add(new File(['{"app":"bad"}'],'bad.json',{type:'application/json'}));el('importBackup').files=dt3.files;el('importBackup').dispatchEvent(new Event('change'));await until(()=>el('notice').textContent.startsWith('Import refusé'));check(localStorage.getItem(key)===saved,'import invalide préserve les données');log.textContent+='\nTERMINÉ : exports et photo validés. Téléchargement et partage système non déclenchés par ce test.';}catch(e){log.textContent+='\nÉCHEC '+e.stack;}finally{if(old===null)localStorage.removeItem(key);else localStorage.setItem(key,old);}};
</script>
