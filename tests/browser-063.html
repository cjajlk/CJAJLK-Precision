<!doctype html><meta charset="utf-8"><title>Validation carnet V0.6.3</title><style>body{font:16px system-ui;background:#11182c;color:white}button{padding:14px}pre{white-space:pre-wrap}iframe{border:1px solid #778}</style><button id="run">Tester V0.6.3</button><pre id="log">Prêt</pre><iframe id="app" src="../carnet/index.html" width="390" height="844"></iframe><script type="module">
import {backup,createSession} from '../carnet/model.js';const frame=document.querySelector('#app'),log=document.querySelector('#log'),KEY='cjajlk-real-notebook-v1',PREF='cjajlk-real-target-preference-v1',wait=ms=>new Promise(r=>setTimeout(r,ms));const el=id=>frame.contentDocument.getElementById(id),click=id=>el(id).click(),change=(id,value)=>{el(id).value=value;el(id).dispatchEvent(new Event('change',{bubbles:true}));},check=(v,m)=>{log.textContent+='\n'+(v?'PASS ':'FAIL ')+m;if(!v)throw Error(m);};const until=async fn=>{for(let i=0;i<150;i++){if(fn())return;await wait(100);}throw Error('Délai dépassé');};const data=()=>JSON.parse(localStorage.getItem(KEY)).sessions;const add=n=>{el('targetScore').value=n;click('targetAdd');};const reload=async()=>{frame.contentWindow.location.reload();await wait(300);await until(()=>el('new')&&el('new').onclick);};
document.querySelector('#run').onclick=async()=>{const old=localStorage.getItem(KEY),pref=localStorage.getItem(PREF);try{log.textContent='En cours';localStorage.setItem(PREF,'5');await reload();click('new');const id=data().at(-1).id;check(el('targetSelect').options.length===6,'30 plombs / 5 : six cibles');click('toastClose');for(const n of [8,7,5,9,6])add(n);check(el('targetSelect').value==='1','passage automatique à la cible 2');check(el('notice').hidden,'pas de toast à chaque plomb');add(7);add(8);click('save');check(el('notice').dataset.kind==='success'&&!el('notice').hidden,'toast succès');await wait(4300);check(el('notice').hidden,'toast disparu après environ quatre secondes');click('toggleTarget');const svg=el('targetVisual').innerHTML;check(el('targetVisual').querySelectorAll('[data-impact]').length===2,'deux impacts illustratifs sur cible courante');await reload();frame.contentDocument.querySelector(`[data-open="${id}"]`).click();click('backEdit');click('toggleTarget');check(el('targetVisual').innerHTML===svg,'illustration stable après rechargement');click('toggleTarget');check(el('targetVisual').hidden,'masquage de la cible');change('targetSelect','0');const input=frame.contentDocument.querySelector('[data-target-shot="0,2"]');input.value=10;input.dispatchEvent(new Event('change'));check(el('targetEntry').textContent.includes('40/50'),'correction cible précédente : 40/50');check(el('totals').textContent.includes('55 / 300'),'total séance corrigé à 55');add(11);check(el('notice').dataset.kind==='error','score invalide : toast erreur');check(data().find(s=>s.id===id).series[0].shots.length===7,'score invalide non enregistré');change('feeling-fatigue','Moyenne');change('feeling-glasses','Oui');el('conditions').value='Éclairage du club';el('conditions').dispatchEvent(new Event('input'));el('includeFeelings').checked=true;el('includeFeelings').dispatchEvent(new Event('change'));click('sheet');check(el('sheetContent').textContent.includes('Éclairage du club'),'sensations présentes sur fiche sur choix explicite');check(el('sheetContent').querySelectorAll('.target-card').length===6,'six cartes lisibles');check(!el('sheetContent').querySelector('table'),'aucun tableau serré');let printed=0;frame.contentWindow.print=()=>printed++;click('print');click('pdf');check(printed===2,'impression/PDF : appels conservés');click('backEdit');el('includeFeelings').checked=false;el('includeFeelings').dispatchEvent(new Event('change'));click('sheet');check(!el('sheetContent').textContent.includes('Éclairage du club'),'bilan masqué à la demande');click('backEdit');
for(const width of [320,360,390]){frame.width=width;await wait(100);click('toggleTarget');check(frame.contentDocument.documentElement.scrollWidth<=width+1,'saisie sans débordement '+width);check(el('targetAdd').getBoundingClientRect().height>=44,'Ajouter ≥44 px '+width);click('sheet');check(frame.contentDocument.documentElement.scrollWidth<=width+1,'fiches sans débordement '+width);click('backEdit');}
click('delete');check(el('confirmDialog').open,'dialogue personnalisé ouvert');check(frame.contentDocument.activeElement===el('confirmCancel'),'focus sur Annuler');click('confirmCancel');await wait(200);check(data().some(s=>s.id===id),'annulation conserve la séance');click('delete');frame.contentWindow.history.back();await wait(200);check(!el('confirmDialog').open&&data().some(s=>s.id===id),'retour navigateur ferme sans suppression');click('delete');click('confirmDelete');await wait(200);check(!data().some(s=>s.id===id),'suppression uniquement après confirmation');
click('new');change('targetPreset','10');check(el('targetSelect').options.length===3,'30/10 : trois cibles');for(let i=0;i<10;i++)add(10);change('targetSelect','0');if(el('targetVisual').hidden)click('toggleTarget');check(el('targetVisual').querySelectorAll('[data-impact]').length===10,'dix impacts numérotés');check(el('targetVisual').querySelectorAll('text').length===10,'dix numéros distincts');click('new');check(el('perTarget').value==='10','préférence mémorisée');change('perTarget','4');check(el('targetSelect').options.length===8,'30/4 : huit cibles');change('targetSelect','7');check(el('targetEntry').textContent.includes('2 plombs'),'dernière cible de deux plombs');
const oldSession=createSession('2026-11-07T09:00');delete oldSession.perTarget;oldSession.series[0].shots=Array(30).fill(8);oldSession.status='done';const before=JSON.stringify(oldSession.series);localStorage.setItem(KEY,backup([...data(),oldSession]));await reload();frame.contentDocument.querySelector(`[data-open="${oldSession.id}"]`).click();check(el('sheetContent').textContent.includes('Série manuelle 1'),'ancienne séance reconnue sans cible inventée');check(JSON.stringify(data().find(s=>s.id===oldSession.id).series)===before,'lecture ancienne sans mutation');click('backEdit');change('targetPreset','5');check(el('targetSelect').options.length===6,'regroupement explicite ancienne séance');check(JSON.stringify(data().find(s=>s.id===oldSession.id).series)===before,'séries anciennes strictement conservées');check(data().find(s=>s.id===oldSession.id).status==='done','regroupement conserve le statut terminé');
log.textContent+='\nTERMINÉ : V0.6.3 validée en navigateur. Aucun téléphone physique testé.';}catch(e){log.textContent+='\nÉCHEC '+e.stack;}finally{if(old===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,old);if(pref===null)localStorage.removeItem(PREF);else localStorage.setItem(PREF,pref);log.textContent+='\nDonnées locales initiales restaurées.';}};
</script>
