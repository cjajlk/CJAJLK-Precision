<!doctype html><meta charset="utf-8"><title>Validation carnet V0.6.4</title><style>body{font:16px system-ui;background:#11182c;color:white}button{padding:14px}pre{white-space:pre-wrap}iframe{border:1px solid #778}</style><button id="run">Tester le pavé et les statistiques</button><pre id="log">Prêt</pre><iframe id="app" src="../carnet/index.html" width="390" height="844"></iframe><script type="module">
import {backup,createSession} from '../carnet/model.js';
const frame=document.querySelector('#app'),log=document.querySelector('#log'),KEY='cjajlk-real-notebook-v1',PREF='cjajlk-real-target-preference-v1',wait=ms=>new Promise(r=>setTimeout(r,ms));
const el=id=>frame.contentDocument.getElementById(id),click=id=>el(id).click(),change=(id,value)=>{el(id).value=value;el(id).dispatchEvent(new Event('change',{bubbles:true}));},check=(v,m)=>{log.textContent+='\n'+(v?'PASS ':'FAIL ')+m;if(!v)throw Error(m);};
const data=()=>JSON.parse(localStorage.getItem(KEY)).sessions,reload=async()=>{frame.contentWindow.location.reload();await wait(500);for(let n=0;n<100&&!el('new')?.onclick;n++)await wait(100);},tap=n=>frame.contentDocument.querySelector(`[data-score="${n}"]`).click(),add=async n=>{await wait(470);tap(n);};
document.querySelector('#run').onclick=async()=>{const old=localStorage.getItem(KEY),pref=localStorage.getItem(PREF);try{log.textContent='En cours';localStorage.setItem(PREF,'5');await reload();click('new');const id=data().at(-1).id;tap(8);tap(8);check(data().find(s=>s.id===id).series[0].shots.length===1,'double appui : un seul score');check(!el('targetEntry').querySelector('input'),'aucun champ ouvrant le clavier dans le pavé');for(let i=1;i<30;i++)await add(i%11);let s=data().find(s=>s.id===id);check(s.series[0].shots.length===30,'30 plombs sauvegardés');check(el('targetSelect').options.length===6&&el('targetSelect').value==='5','six cibles, passage automatique');check(frame.contentDocument.querySelector('[data-score="8"]').disabled,'pavé bloqué à 30');await wait(470);click('undoShot');check(data().find(s=>s.id===id).series[0].shots.length===29,'annulation immédiate du dernier');await add(10);change('targetSelect','0');frame.contentDocument.querySelector('[data-edit-shot="0,0"]').click();await add(0);check(data().find(s=>s.id===id).series[0].shots[0]===0,'correction ancienne sans changer ordre');check(el('analysisContent').querySelectorAll('.histogram>div').length===11,'onze fréquences');check(el('analysisContent').querySelectorAll('meter').length===6,'six résultats par cible');click('finish');check(data().find(s=>s.id===id).status==='done','séance terminée');let printCalls=0;frame.contentWindow.print=()=>printCalls++;click('print');click('pdf');check(printCalls===2,'impression et PDF routés vers impression');await reload();frame.contentDocument.querySelector(`[data-open="${id}"]`).click();click('backEdit');check(data().find(s=>s.id===id).series[0].shots[0]===0,'fermeture/réouverture conserve correction et trente scores');
for(const width of [320,360,390]){frame.width=width;await wait(100);check(frame.contentDocument.documentElement.scrollWidth<=width+1,'aucun débordement à '+width);check([...el('targetEntry').querySelectorAll('[data-score]')].every(b=>b.getBoundingClientRect().height>=56&&b.getBoundingClientRect().width>=44),'onze touches tactiles adaptées à '+width);el('sessionAnalysis').open=true;check(frame.contentDocument.documentElement.scrollWidth<=width+1,'statistiques sans débordement à '+width);}
frame.contentDocument.querySelector('.session-tools').open=true;click('clockStart');await wait(1100);click('clockPause');check(el('clockValue').textContent!=='00:00','chronomètre démarre');const paused=el('clockValue').textContent;await wait(1100);check(el('clockValue').textContent===paused,'pause stable');click('clockReset');check(el('clockValue').textContent==='00:00','remise à zéro');change('clockMode','timer');change('timerMinutes','0');check(el('clockStart').disabled,'durée invalide bloque le minuteur');change('timerMinutes','1');check(!el('clockStart').disabled&&el('clockValue').textContent==='01:00','minuteur configurable');change('clockMode','stopwatch');check(!el('wakeToggle').checked,'écran allumé désactivé par défaut');
click('new');change('targetPreset','10');for(let i=0;i<10;i++)await add(7);check(el('targetSelect').options.length===3&&el('targetSelect').value==='1','30/10 : passage au deuxième carton');change('perTarget','4');change('targetSelect','7');check(el('targetEntry').textContent.includes('/20'),'30/4 : dernier carton de deux');change('entryMode','quick');el('quickTotal').value=240;el('quickTotal').dispatchEvent(new Event('input'));check(el('analysisContent').textContent.includes('indisponibles'),'rapide exclu des statistiques individuelles');
const legacy=createSession('2026-11-01T09:00');delete legacy.perTarget;legacy.series[0].shots=[0,10,null];const before=JSON.stringify(legacy);localStorage.setItem(KEY,backup([...data(),legacy]));await reload();frame.contentDocument.querySelector(`[data-open="${legacy.id}"]`).click();check(JSON.stringify(data().find(s=>s.id===legacy.id))===before,'lecture ancienne strictement intacte');click('backEdit');await add(7);check(!Object.hasOwn(data().find(s=>s.id===legacy.id),'perTarget'),'pavé ancienne séance sans migration imposée');check(data().find(s=>s.id===legacy.id).series[0].shots.join(',')==='0,10,,7','ordre ancien conservé');
const stored=localStorage.getItem(KEY),originalSet=frame.contentWindow.Storage.prototype.setItem;frame.contentWindow.Storage.prototype.setItem=function(){throw new Error('Quota simulé');};await add(8);check(localStorage.getItem(KEY)===stored,'échec stockage : aucun score perdu ou ajouté');check(el('notice').textContent.includes('Non enregistré'),'échec stockage signalé');frame.contentWindow.Storage.prototype.setItem=originalSet;click('save');
frame.contentDocument.querySelector('[data-page="progress"]').click();check(el('targetComparisons').textContent.includes('5 plombs par cible'),'comparaisons regroupées par format de carton');

log.textContent+='\nTERMINÉ : V0.6.4 validée. Pas de téléphone physique testé.';}catch(e){log.textContent+='\nÉCHEC '+e.stack;}finally{if(old===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,old);if(pref===null)localStorage.removeItem(PREF);else localStorage.setItem(PREF,pref);log.textContent+='\nDonnées initiales restaurées.';}};
</script>
