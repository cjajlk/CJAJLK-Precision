<!doctype html><meta charset="utf-8"><title>Validation carnet 0.6.2</title><style>body{font:16px system-ui;background:#11182c;color:white}button{padding:16px}iframe{border:1px solid #888}pre{white-space:pre-wrap}</style><button id="run">Tester le carnet de 30 plombs</button><pre id="log">Prêt</pre><iframe id="app" width="390" height="844" src="../carnet/index.html"></iframe><script type="module">
const frame=document.querySelector('#app'),log=document.querySelector('#log'),key='cjajlk-real-notebook-v1';const wait=ms=>new Promise(r=>setTimeout(r,ms));const until=async(fn)=>{for(let i=0;i<150;i++){if(fn())return;await wait(100);}throw Error('Délai dépassé');};const check=(ok,msg)=>{log.textContent+='\n'+(ok?'PASS ':'FAIL ')+msg;if(!ok)throw Error(msg);};const el=id=>frame.contentDocument.getElementById(id),click=id=>el(id).click(),set=(id,v)=>{el(id).value=v;el(id).dispatchEvent(new Event('input',{bubbles:true}));};const data=()=>JSON.parse(localStorage.getItem(key)).sessions;const add=(i,n)=>{el('score-'+i).value=n;frame.contentDocument.querySelector(`[data-add="${i}"]`).click();};
document.querySelector('#run').onclick=async()=>{const old=localStorage.getItem(key),legacy=localStorage.getItem('cjajlk-precision-sessions');try{log.textContent='En cours';await until(()=>el('new'));click('new');set('notes','TEST TEMPORAIRE CARNET');const id=data().at(-1).id;check(data().at(-1).planned===30,'format initial 30');for(let i=0;i<5;i++)add(0,9);check(data().find(s=>s.id===id).series[0].shots.length===5,'cinq tirs enregistrés');click('save');frame.contentWindow.location.reload();await wait(400);await until(()=>frame.contentDocument.querySelector(`[data-open="${id}"]`));frame.contentDocument.querySelector(`[data-open="${id}"]`).click();click('backEdit');check(el('totals').textContent.includes('5/30'),'reprise après rechargement de page');for(let i=1;i<=12;i++){click('addSeries');add(i,9);add(i,10);}click('addSeries');frame.contentDocument.querySelector('[data-uncertain="13"]').click();click('finish');check(data().find(s=>s.id===id).status==='draft','incertain interdit de terminer');const input=frame.contentDocument.querySelector('[data-shot="13,0"]');input.value=8;input.dispatchEvent(new Event('change',{bubbles:true}));const first=frame.contentDocument.querySelector('[data-shot="0,0"]');first.value=10;first.dispatchEvent(new Event('change',{bubbles:true}));check(data().find(s=>s.id===id).series[0].shots[0]===10,'correction conservée');add(13,10);check(el('notice').textContent.includes('Trop de tirs'),'dépassement bloqué');click('finish');check(data().find(s=>s.id===id).status==='done','30 tirs terminés');check(el('sheetContent').textContent.includes('282 / 300'),'score final 282/300');check(el('sheetContent').textContent.includes('TEST TEMPORAIRE'),'notes sur fiche');let printed=0;frame.contentWindow.print=()=>printed++;click('print');click('pdf');check(printed===2,'deux boutons appellent impression (dialogue natif non testé ici)');click('new');el('format').value='40';el('format').dispatchEvent(new Event('change',{bubbles:true}));el('entryMode').value='quick';el('entryMode').dispatchEvent(new Event('change',{bubbles:true}));set('quickTotal','350');click('finish');check(el('sheetContent').textContent.includes('350 / 400'),'saisie rapide 40 plombs');frame.contentDocument.querySelector('[data-page="progress"]').click();check(el('progressFormat').options.length>=2,'progressions 30 et 40 séparées');el('progressFormat').value='rifle10-integer|40';el('progressFormat').dispatchEvent(new Event('change'));check(el('records').textContent.includes('350'),'record format 40');el('chartMode').value='sd';el('chartMode').dispatchEvent(new Event('change'));check(el('chart').textContent.includes('Aucune'),'aucune régularité inventée en rapide');frame.contentDocument.querySelector('[data-page="history"]').click();set('month',data().find(s=>s.id===id).date.slice(0,7));const checkbox=frame.contentDocument.querySelector(`[data-check="${id}"]`);checkbox.checked=true;checkbox.dispatchEvent(new Event('change',{bubbles:true}));click('monthly');check(el('sheetContent').textContent.includes('282 / 300'),'bilan mensuel sélectionné');check(localStorage.getItem('cjajlk-precision-sessions')===legacy,'sauvegardes simulateur intactes');for(const [w,h] of [[390,844],[844,390],[1280,800]]){frame.width=w;frame.height=h;await wait(200);click('backEdit');check(frame.contentDocument.documentElement.scrollWidth<=w+1,'aucun débordement horizontal '+w+'×'+h);for(const bid of ['save','finish','addSeries'])check(el(bid).getBoundingClientRect().height>=44,'bouton '+bid+' ≥44px '+w);}
log.textContent+='\nTERMINÉ : parcours carnet réussi. Émulation navigateur, pas de téléphone physique.';}catch(e){log.textContent+='\nÉCHEC '+e.stack;}finally{if(old===null)localStorage.removeItem(key);else localStorage.setItem(key,old);log.textContent+='\nDonnées de test nettoyées, sauvegarde locale initiale restaurée.';}};
</script>
