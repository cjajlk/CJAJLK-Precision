<!doctype html><meta charset="utf-8"><title>Suite de validation 0.6.4</title><style>body{background:#11182c;color:white;font:16px system-ui}pre{white-space:pre-wrap}iframe{width:95vw;height:850px}button{padding:16px}</style><button id="run">Exécuter tous les tests</button><pre id="log">Prêt</pre><iframe id="test"></iframe><script type="module">
const frame=document.querySelector('iframe'),log=document.querySelector('#log'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='Démarrage';const keys=['cjajlk-precision-sessions','cjajlk-precision-best'],initial=keys.map(k=>localStorage.getItem(k));try{for(const file of ['browser-063.html','browser-064.html','browser-notebook.html','browser-exports.html','browser-touch.html','browser-cache.html'].filter(file=>!new URLSearchParams(location.search).has('only')||new URLSearchParams(location.search).get('only').split(',').includes(file))){log.textContent+='\nEN COURS '+file;frame.src=file;await new Promise(r=>frame.onload=r);await wait(1500);frame.contentDocument.querySelector('#run').click();let text='';for(let i=0;i<360;i++){await wait(500);text=frame.contentDocument.querySelector('#log').textContent;if(/TERMINÉ|ÉCHEC|FAIL/.test(text))break;}log.textContent+='\n'+text;if(!text.includes('TERMINÉ')||/ÉCHEC|FAIL/.test(text))throw Error(file);await wait(500);}log.textContent+='\nSUCCÈS GLOBAL';}catch(e){log.textContent+='\nARRÊT '+e.message;}finally{keys.forEach((k,i)=>initial[i]===null?localStorage.removeItem(k):localStorage.setItem(k,initial[i]));document.querySelector('#run').disabled=false;}};
</script>
